<!-- Website, black background, logo centered in the middle, short description underneath, footer with socials  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .logo {
            margin-top: 50px;
        }
        .description {
            margin-top: 20px;
            font-size: 1.2em;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #333;
            padding: 10px 0;
        }
        .socials a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
     
</head>
<body>
    <div class="logo">
        <img src="logo.png" alt="Logo" width="200">
    </div>
    <div class="description">
        
    </div>
</body>
</html>
